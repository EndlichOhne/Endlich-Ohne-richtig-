<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Outfit;
        font-weight: 400 700;
        src: url("./outfit.woff2") format("woff2");
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: #071617; }
      body {
        font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
        color: #f3f8f8;
        overflow: hidden;
      }
      .frame {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #071617;
      }
      .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 78% 42%;
      }
      .veil {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to right,
            rgb(7 22 23 / 0.96) 0%,
            rgb(7 22 23 / 0.78) 38%,
            rgb(7 22 23 / 0.22) 68%,
            rgb(7 22 23 / 0.12) 100%
          );
      }
      .inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 58%;
        height: 100%;
        padding: 8% 0 8% 5.5%;
      }
      .mark {
        height: 3.2rem;
        width: auto;
        display: block;
      }
      .kicker {
        margin-top: 1.6rem;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #5fd5d4;
      }
      h1 {
        margin-top: 0.7rem;
        font-size: 2.35rem;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.08;
      }
      .rule {
        margin: 1.15rem 0 0.85rem;
        width: 2.6rem;
        height: 2px;
        background: #00a8a8;
      }
      .place {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        color: rgb(243 248 248 / 0.62);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <img class="photo" src="./wide.jpg" alt="" />
      <div class="veil"></div>
      <div class="inner">
        <img class="mark" src="./logo-white.svg" alt="ENDLICH OHNE" />
        <p class="kicker">Ärztliche Laser-Tattooentfernung</p>
        <h1>Tattoo entfernen.<br />Informiert entscheiden.</h1>
        <div class="rule"></div>
        <p class="place">Karlsruhe</p>
      </div>
    </div>
  </body>
</html>
